<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rogue 2048 — Global Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =====================================================================
       ROGUE 2048 DESIGN SYSTEM TOKENS
       Extracted strictly from the provided visual references
       ===================================================================== */
    :root {
      --bg-void: #100E0E;
      --bg-game: #191616;
      --bg-modal: #251E1C;
      --bg-surface: #302522;
      --bg-surface-elevated: #3A2E2A;
      --bg-surface-subtle: #241C1A;
      --border-subtle: #44352F;
      --border-highlight: #5A473E;
      --gold-primary: #F4C879;
      --gold-secondary: #DDAA5E;
      --gold-glow: rgba(244, 200, 121, 0.28);
      --silver-accent: #D2D7DF;
      --silver-glow: rgba(210, 215, 223, 0.2);
      --bronze-accent: #E2A06E;
      --bronze-glow: rgba(226, 160, 110, 0.2);
      --text-primary: #F5F0E9;
      --text-secondary: #A99A90;
      --text-muted: #766A64;
      --font-stack: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient radial glow to recreate dark room indie arcade vibe */
    .viewport-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(68, 53, 47, 0.16) 0%, rgba(16, 14, 14, 0.95) 75%);
      z-index: 0;
    }

    /* ---------------------------------------------------------------------
       CENTRAL GAME CHASSIS
       Matches the ~400px centered mobile viewport on desktop
       --------------------------------------------------------------------- */
    .game-device-frame {
      position: relative;
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: var(--bg-game);
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(68, 53, 47, 0.35);
      border-radius: 28px;
      overflow: hidden;
      z-index: 1;
    }

    @media (max-width: 480px) {
      .game-device-frame {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* =====================================================================
       UNDERLYING SCREEN: ACCURATE ROGUE 2048 LANDING & GAMEPLAY MOCKUP
       ===================================================================== */
    .game-canvas-bg {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 20px 20px;
      position: relative;
      background: linear-gradient(180deg, #1A1717 0%, #161313 100%);
    }

    /* Top bar of game */
    .mock-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
    }

    .mock-brand {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mock-brand-badge {
      background: var(--gold-primary);
      color: #100E0E;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 5px;
      letter-spacing: 0;
    }

    .mock-header-actions {
      display: flex;
      gap: 8px;
    }

    .mock-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.15s;
    }

    .mock-icon-btn:hover {
      background-color: var(--bg-surface-elevated);
      transform: translateY(-1px);
    }

    .mock-icon-btn.leaderboard-trigger {
      position: relative;
      border-color: rgba(244, 200, 121, 0.4);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    /* Pulse dot on leaderboard button */
    .pulse-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-primary);
      box-shadow: 0 0 8px var(--gold-primary);
      animation: pulseAnim 2s infinite ease-in-out;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Gameplay mini-stats bar */
    .mock-stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .mock-stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .mock-stat-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .mock-stat-val {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .mock-stat-val.gold {
      color: var(--gold-primary);
    }

    /* Game 4x4 Grid */
    .mock-grid-container {
      background: #141111;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      aspect-ratio: 1;
      width: 100%;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    }

    .mock-tile {
      background: #231B19;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: var(--text-primary);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3);
    }

    .mock-tile.t-2 { background: #2E2522; color: #D5C9BE; font-size: 20px; }
    .mock-tile.t-4 { background: #352B28; color: #E7DBD0; font-size: 20px; }
    .mock-tile.t-8 { background: #4D3325; color: #F5EAE0; }
    .mock-tile.t-16 { background: #613B28; color: #FFF1E6; }
    .mock-tile.t-64 { background: #7C4524; color: #FFF8F0; }
    .mock-tile.t-512 {
      background: var(--gold-primary);
      color: #1A1308;
      box-shadow: 0 4px 14px var(--gold-glow);
      font-weight: 900;
    }

    /* Actions bar bottom */
    .mock-bottom-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .mock-btn-main {
      background: var(--gold-primary);
      color: #120F0D;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 14px;
      border-radius: 12px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--gold-glow);
      transition: filter 0.15s, transform 0.15s;
    }

    .mock-btn-main:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .mock-tip {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.4px;
    }

    /* =====================================================================
       GLOBAL LEADERBOARD MODAL (THE CORE DELIVERABLE)
       Exact visual fidelity with Rogue 2048 'Best Runs' overlay
       ===================================================================== */
    .leaderboard-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(10, 8, 8, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .leaderboard-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .leaderboard-modal {
      width: 100%;
      height: 100%;
      max-height: 840px;
      background-color: var(--bg-modal);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(244, 200, 121, 0.08);
      transform: scale(0.95) translateY(14px);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .leaderboard-backdrop.active .leaderboard-modal {
      transform: scale(1) translateY(0);
    }

    /* Header component */
    .modal-header {
      padding: 20px 20px 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      border-bottom: 1px solid rgba(68, 53, 47, 0.35);
    }

    .header-text-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .header-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--gold-primary);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-eyebrow svg {
      width: 13px;
      height: 13px;
      fill: var(--gold-primary);
    }

    .header-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: var(--text-primary);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 1px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border-color: var(--gold-secondary);
      transform: scale(1.05);
    }

    /* Category Navigation Tabs */
    .category-tabs-wrapper {
      padding: 10px 18px 8px 18px;
      background: rgba(25, 22, 22, 0.4);
    }

    .category-tabs {
      display: flex;
      background: #1B1514;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 3px;
      gap: 4px;
    }

    .category-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-stack);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 8px 6px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-transform: uppercase;
    }

    .category-tab-btn:hover:not(.active) {
      color: var(--text-secondary);
      background: rgba(68, 53, 47, 0.25);
    }

    .category-tab-btn.active {
      background: var(--bg-surface-elevated);
      color: var(--gold-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(244, 200, 121, 0.3);
    }

    /* =====================================================================
       PODIUM (TOP 3 PLAYERS)
       Compact, restrained indie arcade aesthetic
       ===================================================================== */
    .podium-section {
      padding: 16px 16px 8px 16px;
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 8px;
      align-items: flex-end;
      position: relative;
    }

    .podium-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 8px 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
      overflow: hidden; /* Keeps the colored accent strip & shimmer clipped cleanly inside */
    }

    /* Original internal top accent line strictly flush inside card boundary */
    .podium-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--border-subtle);
      z-index: 2;
    }

    /* Card 1 container wrapper to allow badge to rise outside without clipping */
    .podium-slot-1 {
      position: relative;
      overflow: visible;
    }

    /* Periodic glass shimmer sweep strictly within card boundary */
    .podium-shimmer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      border-radius: 13px;
    }

    .podium-shimmer::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -130%;
      width: 60%;
      height: 200%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.04) 20%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(255, 255, 255, 0.04) 80%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: glassShimmer 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .podium-card.rank-1 .podium-shimmer::after {
      background: linear-gradient(
        90deg,
        rgba(244, 200, 121, 0) 0%,
        rgba(244, 200, 121, 0.06) 20%,
        rgba(255, 245, 215, 0.25) 50%,
        rgba(244, 200, 121, 0.06) 80%,
        rgba(244, 200, 121, 0) 100%
      );
      animation-delay: 0.2s;
    }

    .podium-card.rank-2 .podium-shimmer::after {
      animation-delay: 0.8s;
    }

    .podium-card.rank-3 .podium-shimmer::after {
      animation-delay: 1.4s;
    }

    @keyframes glassShimmer {
      0% {
        left: -130%;
      }
      25% {
        left: 170%;
      }
      100% {
        left: 170%;
      }
    }

    /* Content layers stay above shimmer */
    .avatar-wrapper,
    .podium-name,
    .podium-score,
    .podium-tile-pill,
    .podium-rank-tag {
      position: relative;
      z-index: 3;
    }

    /* #1 Champion Card */
    .podium-card.rank-1 {
      background: linear-gradient(180deg, #372A24 0%, #291F1C 100%);
      border-color: rgba(244, 200, 121, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 20px rgba(244, 200, 121, 0.12);
      padding-top: 14px;
      padding-bottom: 12px;
    }

    .podium-slot-1 {
      transform: translateY(-4px);
    }

    .podium-card.rank-1::before {
      background: linear-gradient(90deg, #DDAA5E, #F4C879, #DDAA5E);
    }

    /* Crown / Trophy badge: elevated above the card without clipping */
    .trophy-badge {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #F4C879, #C8923B);
      color: #19140C;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 10px rgba(244, 200, 121, 0.3);
      border: 1.5px solid #201A18;
      z-index: 10;
    }

    .trophy-badge svg {
      width: 12px;
      height: 12px;
      fill: #19140C;
    }

    /* Rank 2 & 3 original top accents */
    .podium-card.rank-2::before {
      background: var(--silver-accent);
    }

    .podium-card.rank-3::before {
      background: var(--bronze-accent);
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 6px;
    }

    .podium-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #231C1A;
      border: 2px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: var(--text-primary);
      position: relative;
    }

    .rank-1 .podium-avatar {
      width: 48px;
      height: 48px;
      border-color: var(--gold-primary);
      font-size: 15px;
      color: var(--gold-primary);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .rank-2 .podium-avatar {
      border-color: var(--silver-accent);
      color: var(--silver-accent);
    }

    .rank-3 .podium-avatar {
      border-color: var(--bronze-accent);
      color: var(--bronze-accent);
    }

    .podium-flag {
      position: absolute;
      bottom: -3px;
      right: -3px;
      font-size: 12px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
      line-height: 1;
    }

    .podium-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }

    .podium-card.rank-1 .podium-name {
      color: #FFF6EC;
      max-width: 104px;
      font-size: 13px;
    }

    .podium-score {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold-primary);
      letter-spacing: -0.3px;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .podium-card.rank-1 .podium-score {
      font-size: 18px;
      text-shadow: 0 0 12px rgba(244, 200, 121, 0.4);
    }

    .podium-tile-pill {
      background: #231C1A;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-secondary);
      padding: 2px 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .rank-1 .podium-tile-pill {
      background: rgba(244, 200, 121, 0.15);
      border-color: rgba(244, 200, 121, 0.35);
      color: var(--gold-primary);
    }

    /* Small badge at card bottom */
    .podium-rank-tag {
      font-size: 10px;
      font-weight: 900;
      margin-top: 4px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .rank-1 .podium-rank-tag { color: var(--gold-primary); }
    .rank-2 .podium-rank-tag { color: var(--silver-accent); }
    .rank-3 .podium-rank-tag { color: var(--bronze-accent); }

    /* =====================================================================
       RANKINGS LIST (RANK #4 ONWARDS)
       Independently scrollable with custom sleek scrollbar
       ===================================================================== */
    .list-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 18px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
      border-top: 1px solid rgba(68, 53, 47, 0.3);
      border-bottom: 1px solid rgba(68, 53, 47, 0.3);
      background: rgba(25, 22, 22, 0.6);
    }

    .rankings-scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
      -webkit-overflow-scrolling: touch;
    }

    .rankings-scroll-area::-webkit-scrollbar {
      width: 5px;
    }

    .rankings-scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .rankings-scroll-area::-webkit-scrollbar-thumb {
      background-color: var(--border-subtle);
      border-radius: 10px;
    }

    .rankings-scroll-area::-webkit-scrollbar-thumb:hover {
      background-color: var(--border-highlight);
    }

    /* Individual Player Row */
    .ranking-row {
      display: grid;
      grid-template-columns: 32px 34px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
      cursor: default;
    }

    .ranking-row:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--border-highlight);
      transform: translateX(2px);
    }

    /* If row belongs to the current user */
    .ranking-row.is-current-user {
      background: rgba(244, 200, 121, 0.08);
      border-color: rgba(244, 200, 121, 0.5);
    }

    .rank-number {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: -0.3px;
    }

    .row-avatar-box {
      position: relative;
      width: 32px;
      height: 32px;
    }

    .row-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #251D1B;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
    }

    .row-flag {
      position: absolute;
      bottom: -3px;
      right: -3px;
      font-size: 10px;
      line-height: 1;
    }

    .player-meta {

            </div>
            <div class="podium-name" title="${p1.username}">${p1.username}</div>
            <div class="podium-score">${formatScore(p1.score)}</div>
            <span class="podium-tile-pill">Tile ${p1.maxTile}</span>
            <div class="podium-rank-tag">#1 CHAMPION</div>
          </div>
        </div>

        <!-- Rank #3 (Right) -->
        <div class="podium-card rank-3">
          <div class="podium-shimmer" aria-hidden="true"></div>
          <div class="avatar-wrapper">
            <div class="podium-avatar">${p3.initials}</div>
            <span class="podium-flag">${p3.country}</span>
          </div>
          <div class="podium-name" title="${p3.username}">${p3.username}</div>
          <div class="podium-score">${formatScore(p3.score)}</div>
          <span class="podium-tile-pill">Tile ${p3.maxTile}</span>
          <div class="podium-rank-tag">#3 BRONZE</div>
        </div>
      `;
    }

    /* ---------------------------------------------------------------------
       RENDER: RANKINGS LIST (#4 ONWARD)
       Staggered entrance and accurate metadata
       --------------------------------------------------------------------- */
    function renderRankingRows(categoryKey) {
      const listContainer = document.getElementById('rankingsScrollList');
      const remainingPlayers = LEADERBOARD_DATA[categoryKey].players.slice(3);

      listContainer.innerHTML = remainingPlayers.map((player, index) => {
        const isCurrent = player.isYou || player.username === "Madhav";
        const delayMs = Math.min(index * 30, 300);

        return `
          <div class="ranking-row ${isCurrent ? 'is-current-user' : ''}" style="animation-delay: ${delayMs}ms">
            <div class="rank-number">#${player.rank}</div>
            
            <div class="row-avatar-box">
              <div class="row-avatar">${player.initials}</div>
              <span class="row-flag">${player.country}</span>
            </div>

            <div class="player-meta">
              <div class="player-username">
                ${player.username}
                ${isCurrent ? '<span class="you-pill">YOU</span>' : ''}
              </div>
              <div class="player-subdetails">
                <span>${player.moves} moves</span>
                <span class="sub-dot"></span>
                <span>Max ${player.maxTile}</span>
              </div>
            </div>

            <div class="player-score-block">
              <span class="player-score-val">${formatScore(player.score)}</span>
              <span class="player-tile-tag">${player.maxTile}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ---------------------------------------------------------------------
       RENDER: PINNED CURRENT PLAYER CARD
       --------------------------------------------------------------------- */
    function renderCurrentUser(categoryKey) {
      const userCard = document.getElementById('currentUserCard');
      const userData = LEADERBOARD_DATA[categoryKey].currentUser;

      userCard.innerHTML = `
        <div class="pinned-rank-badge">
          #${userData.rank}
        </div>

        <div class="row-avatar-box">
          <div class="row-avatar" style="border-color: var(--gold-primary); color: var(--gold-primary);">
            ${userData.initials}
          </div>
          <span class="row-flag">${userData.country}</span>
        </div>

        <div class="player-meta">
          <div class="player-username" style="color: #FFF;">
            ${userData.username}
            <span class="you-pill">YOU</span>
          </div>
          <div class="player-subdetails">
            <span>${userData.moves} moves</span>
            <span class="sub-dot"></span>
            <span>Max Tile ${userData.maxTile}</span>
          </div>
        </div>

        <div class="player-score-block">
          <span class="player-score-val" style="font-size: 16px;">${formatScore(userData.score)}</span>
          <span class="player-tile-tag" style="background: rgba(244, 200, 121, 0.15); color: var(--gold-primary); border-color: rgba(244, 200, 121, 0.4);">
            ${userData.maxTile}
          </span>
        </div>
      `;
    }

    /* Update full leaderboard content */
    function updateLeaderboard(categoryKey) {
      renderPodium(categoryKey);
      renderRankingRows(categoryKey);
      renderCurrentUser(categoryKey);
      // Reset scroll position to top on category change
      document.getElementById('rankingsScrollList').scrollTop = 0;
    }

    /* ---------------------------------------------------------------------
       MODAL CONTROLS & EVENT LISTENERS
       --------------------------------------------------------------------- */
    const backdrop = document.getElementById('leaderboardBackdrop');
    const modal = document.getElementById('leaderboardModal');
    const openBtn1 = document.getElementById('openLeaderboardBtn');
    const openBtn2 = document.getElementById('openLeaderboardBtn2');
    const closeBtn = document.getElementById('closeLeaderboardBtn');
    const tabButtons = document.querySelectorAll('.category-tab-btn');

    function openLeaderboard() {
      backdrop.classList.add('active');
    }

    function closeLeaderboard() {
      backdrop.classList.remove('active');
    }

    // Open triggers
    openBtn1.addEventListener('click', openLeaderboard);
    openBtn2.addEventListener('click', openLeaderboard);

    // Close triggers
    closeBtn.addEventListener('click', closeLeaderboard);

    // Click outside modal inside backdrop to close
    backdrop.addEventListener('click', (event) => {
      if (event.target === backdrop) {
        closeLeaderboard();
      }
    });

    // Keyboard support: Escape key closes modal
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && backdrop.classList.contains('active')) {
        closeLeaderboard();
      }
    });

    // Category Tabs Switching
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');

        const selectedCategory = btn.dataset.category;
        currentCategory = selectedCategory;
        updateLeaderboard(selectedCategory);
      });
    });

    // Initialize initial state
    updateLeaderboard('allTime');
  </script>
</body>
</html>
